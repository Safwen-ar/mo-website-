<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safwen Aroua - Accueil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .accueil-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        
        .content-wrapper {
            display: flex;
            align-items: center;
            gap: 30px; 
            justify-content: center;
        }

        .photo-cliquable {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .photo-cliquable img {
            width: 180px;
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            border: 4px solid #0d1b2a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        .photo-cliquable:hover {
            transform: scale(1.05);
        }

        .nom-box {
            border: 2px solid black;
            padding: 15px 30px;
            font-weight: bold;
            font-size: 1.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #333;
            background-color: #d0e1f9; 
            border-radius: 8px;
        }

        
        .hint {
            margin-top: 25px;
            color: #666;
            font-size: 0.95em;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="accueil-container">
        <div class="content-wrapper">
            <a href="cv.html" class="photo-cliquable" title="Cliquez pour voir mon CV">
                <img src="SAF COSTUME (1).jpg" alt="Photo de Safwen Aroua">
            </a>
            <div class="nom-box">
                SAFWEN AROUA
            </div>
        </div>
        <div class="hint">
            👆 Cliquez sur votre photo pour accéder au CV complet
        </div>
    </div>

</body>
</html>
